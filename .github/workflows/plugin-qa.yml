name: Plugin QA

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/**
      - fix/**

permissions:
  contents: read

jobs:
  php-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint source PHP
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify cache and activation-response security
        run: php tests/license-cache-security.php
